<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="高中物理模型交互实验室——模型库总入口框架原型">
  <title>高中物理模型交互实验室 · 模型库</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-shell">
    <!-- 顶部：品牌 + 搜索 -->
    <header class="topbar">
      <button id="menuToggle" class="menu-toggle" type="button"
              aria-label="打开模型列表" aria-expanded="false" aria-controls="sidebar">
        <span></span><span></span><span></span>
      </button>

      <div class="brand">
        <div class="brand__mark" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
        </div>
        <div class="brand__text">
          <h1 class="brand__title">高中物理模型交互实验室</h1>
          <p class="brand__subtitle">按学科浏览模型 · 切换拓展模型，快速定位你要讲的那一个</p>
        </div>
      </div>

      <div class="topbar__right">
        <label class="search" for="modelSearch">
          <span class="search__icon" aria-hidden="true">⌕</span>
          <input id="modelSearch" type="search" placeholder="搜索模型 / 学科"
                 autocomplete="off" aria-label="搜索模型或学科">
        </label>
        <span class="counter" id="modelCounter"></span>
      </div>
    </header>

    <div class="workspace">
      <!-- 左侧：分类 + 模型列表 -->
      <aside class="sidebar" id="sidebar" aria-label="模型导航">
        <div class="sidebar__head">
          <div class="sidebar__title">模型库</div>
          <div class="sidebar__hint" id="sidebarHint">点击分类标题可展开 / 收起</div>
        </div>
        <nav class="model-list" id="modelList" aria-label="模型列表"></nav>
      </aside>

      <!-- 右侧：当前模型视图 -->
      <main class="main" id="main">
        <div class="main__inner" id="mainInner">
          <section class="model-header" id="modelHeader" aria-labelledby="modelTitle"></section>
          <div class="subtabs" id="subTabs" role="tablist" aria-label="拓展模型"></div>
          <section class="panel" id="panel" role="tabpanel" tabindex="0"></section>
        </div>
      </main>
    </div>

    <div class="drawer-overlay" id="drawerOverlay" aria-hidden="true"></div>
  </div>

  <noscript>请开启 JavaScript 后使用模型库（本页为纯前端静态框架，无需联网）。</noscript>

  <!-- 顺序加载，无 module / 无 import、零外部依赖，可直接 file:// 双击打开 -->
  <script src="js/catalog.js"></script>

  <!--
    交互模块：普通 script，按 catalog 的模型顺序加载；文件尚未产出时浏览器 404 不会阻断后续脚本。
    模块通过 window.ModelLab.modules[模型id] = { render(container, extIndex){ ...; return cleanup; } } 注册。
    以下覆盖全部 27 个模型 id，新模块文件产出后无需再改本文件即可自动生效。
  -->
  <script src="js/modules/spring-oscillator.js"></script>
  <script src="js/modules/pendulum.js"></script>
  <script src="js/modules/inclined-block.js"></script>
  <script src="js/modules/conveyor-belt.js"></script>
  <script src="js/modules/connected-bodies.js"></script>
  <script src="js/modules/circular-motion.js"></script>
  <script src="js/modules/projectile-motion.js"></script>
  <script src="js/modules/collision.js"></script>
  <script src="js/modules/block-plate.js"></script>
  <script src="js/modules/capacitor.js"></script>
  <script src="js/modules/charged-particle-electric.js"></script>
  <script src="js/modules/equipotential.js"></script>
  <script src="js/modules/electrostatic-induction.js"></script>
  <script src="js/modules/charged-particle-magnetic.js"></script>
  <script src="js/modules/velocity-selector.js"></script>
  <script src="js/modules/mass-spectrometer.js"></script>
  <script src="js/modules/cyclotron.js"></script>
  <script src="js/modules/electromagnetic-flowmeter.js"></script>
  <script src="js/modules/rod-cutting-field.js"></script>
  <script src="js/modules/loop-entering-field.js"></script>
  <script src="js/modules/self-mutual-induction.js"></script>
  <script src="js/modules/lc-oscillation.js"></script>
  <script src="js/modules/ideal-gas.js"></script>
  <script src="js/modules/refraction-total-reflection.js"></script>
  <script src="js/modules/double-slit.js"></script>
  <script src="js/modules/photoelectric-effect.js"></script>
  <script src="js/modules/nuclear-decay.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
